# MySQL 配置
[mysql]
host = localhost
user = root
password =
database = subjects_kg

# Redis 配置
[redis]
host = 127.0.0.1
port = 6379
password =
db = 0

# 日志配置
[logger]
log_file = logs/app.log


# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_0421

# LLM 配置
[llm]
model = deepseek-v4-flash
dashscope_api_key =
dashscope_base_url = https://api.deepseek.com

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678
rag_enabled = false
